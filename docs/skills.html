<script>
// Lazy-load model-viewer when needed
function loadModelViewer() {
  if (document.querySelector('model-viewer[model-viewer-loaded]')) return;
  const s = document.createElement('script');
  s.type = 'module';
  s.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js';
  document.head.appendChild(s);
  document.querySelectorAll('model-viewer').forEach(mv => mv.setAttribute('model-viewer-loaded', ''));
}
// Load when Text2Word or Img2GS section becomes visible
if ('IntersectionObserver' in window) {
  const mvObs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { loadModelViewer(); mvObs.disconnect(); } });
  }, { rootMargin: '200px' });
  document.addEventListener('DOMContentLoaded', () => {
    const t2w = document.getElementById('text2word');
    const i2g = document.getElementById('img2gs');
    if (t2w) mvObs.observe(t2w);
    if (i2g) mvObs.observe(i2g);
  });
}

function renderSkills() {
  const grid = document.getElementById('skillsGrid');
  grid.innerHTML = SKILLS.map(s => `
    <div class="skill-card gradient-border p-5 flex flex-col gap-3">
      <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background:${s.color}15">
        <svg class="w-5 h-5" style="color:${s.color}" fill="none" stroke="currentColor" viewBox="0 0 24 24">${s.icon}</svg>
      </div>
      <div>
        <h3 class="font-semibold text-slate-900 text-sm">${window.AGS_LANG === 'zh' ? (s.nameZh || s.name) : s.name}</h3>
        <p class="mt-1 text-xs text-slate-600 leading-relaxed">${window.AGS_LANG === 'zh' ? (s.descZh || s.desc) : s.desc}</p>
      </div>
    </div>
  `).join('');
}

function renderInstall() {
  const container = document.getElementById('installBlocks');
  container.innerHTML = INSTALL_BLOCKS.map((b, i) => `
    <div class="gradient-border p-0 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-2.5 border-b border-slate-900/5">
        <span class="text-sm font-medium text-slate-900">${b.label}</span>
        <button class="copy-btn text-xs text-slate-600 hover:text-slate-900 transition flex items-center gap-1" data-idx="${i}">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          ${AGS_T('copy')}
        </button>
      </div>
      <pre class="p-4 overflow-x-auto text-slate-700 bg-slate-50 rounded-b-xl"><code>${escapeHtml(b.code)}</code></pre>
    </div>
  `).join('');
  container.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.dataset.idx;
      navigator.clipboard.writeText(INSTALL_BLOCKS[idx].code).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> ' + AGS_T('copied');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg> ' + AGS_T('copy');
        }, 2000);
      });
    });
  });
}

function renderTrends() {
  const grid = document.getElementById('trendsGrid');
  grid.innerHTML = TRENDS.map(t => `
    <div class="trend-card gradient-border p-5 flex flex-col gap-3">
      <h3 class="font-semibold text-slate-900 text-sm leading-tight">${window.AGS_LANG === 'zh' ? (t.titleZh || t.title) : t.title}</h3>
      <p class="text-xs text-slate-600 leading-relaxed">${window.AGS_LANG === 'zh' ? (t.descZh || t.desc) : t.desc}</p>
      <div class="flex flex-wrap gap-1.5 mt-auto pt-1">
        ${t.tags.map(tag => `<span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-accent-blue/10 text-accent-blue">${tag}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
}, { threshold: 0.01 });

document.addEventListener('DOMContentLoaded', function () {
  renderSkills(); renderInstall(); renderTrends();
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
});
</script>

</body>
</html>
