# ============================================================
# MoneyPrinterTurbo (MPT) — Docker Compose
# ============================================================
# 用途：以 HTTP API Sidecar 方式运行 MPT，为 SplatVerse Studio
#       提供扩展 TTS / 在线素材视频生成 / 跨平台发布能力
#
# 启动：
#   cp mpt-config.example.toml mpt-config.toml   # 填入 API Key
#   docker compose -f docker-compose.mpt.yml up -d
#
# 验证：
#   curl http://localhost:8501/api/v1/tasks?page=1&page_size=1
#
# 在 Studio .env 中设置：
#   MPT_ENABLED=true
#   MPT_API_URL=http://localhost:8501
# ============================================================

services:
  mpt:
    # 官方镜像，内置 Python 3.10 + FFmpeg + ImageMagick
    image: harry0703/moneyprinterturbo:latest
    container_name: splatverse-mpt
    restart: unless-stopped

    ports:
      - "8501:8501"   # FastAPI REST API（Studio bridge 调用）
      - "8500:8500"   # Streamlit Web UI（可选，可视化操作）

    volumes:
      # 配置文件：MPT 的 config.toml
      - ./mpt-config.toml:/MoneyPrinterTurbo/config.toml:ro
      # 生成的视频/音频/字幕持久化到宿主机
      - ./mpt-storage:/MoneyPrinterTurbo/storage
      # 本地素材目录（material_source=local 时读取）
      - ./mpt-materials:/MoneyPrinterTurbo/materials

    environment:
      # 覆盖 MPT 的工作进程数（默认 1，并发高时调大）
      - MAX_WORKERS=2
      # 时区
      - TZ=Asia/Shanghai

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/api/v1/tasks?page=1&page_size=1')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # 资源限制（按需调整）
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

    # 若需 GPU（本地 Whisper / 本地图片生成），取消注释：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
