  </defs>
  <rect width="680" height="360" rx="18" fill="url(#bg)"/>
  <text x="40" y="54" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2a44">具身智能体 = 空间表征 × 感知 × 规划 × 行动</text>
  <text x="40" y="80" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#5b6b8c">Embodied Agent = Spatial Representation × Perception × Planning × Action</text>

  <!-- 4 chips -->
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="34" y="128" width="138" height="78" rx="12" fill="#ffffff" stroke="#c9d6f5"/>
    <text x="103" y="162" font-size="17" font-weight="700" fill="#23408f">空间表征</text>
    <text x="103" y="186" font-size="12" fill="#5b6b8c">3DGS 显式解</text>

    <rect x="189" y="128" width="138" height="78" rx="12" fill="#ffffff" stroke="#c9d6f5"/>
    <text x="258" y="162" font-size="17" font-weight="700" fill="#23408f">感知</text>
    <text x="258" y="186" font-size="12" fill="#5b6b8c">语义高斯查询</text>

    <rect x="344" y="128" width="138" height="78" rx="12" fill="#ffffff" stroke="#c9d6f5"/>
    <text x="413" y="162" font-size="17" font-weight="700" fill="#23408f">规划</text>
    <text x="413" y="186" font-size="12" fill="#5b6b8c">VLA / 世界模型</text>

    <rect x="499" y="128" width="138" height="78" rx="12" fill="#ffffff" stroke="#c9d6f5"/>
    <text x="568" y="162" font-size="17" font-weight="700" fill="#23408f">行动</text>
    <text x="568" y="186" font-size="12" fill="#5b6b8c">Sim2Real 执行</text>

    <text x="172" y="172" font-size="22" font-weight="700" fill="#7c4dff">×</text>
    <text x="327" y="172" font-size="22" font-weight="700" fill="#7c4dff">×</text>
    <text x="482" y="172" font-size="22" font-weight="700" fill="#7c4dff">×</text>
  </g>

  <!-- NVIDIA triangle note -->
  <rect x="34" y="240" width="612" height="84" rx="12" fill="#ffffff" stroke="url(#acc)"/>
  <text x="52" y="270" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2a44">呼应 NVIDIA Physical AI 技术三角（Perceive → Reason → Act）</text>
  <text x="52" y="294" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#5b6b8c">3DGS 在「空间表征」这一因子上给出当前最强显式解——这正是本书主线。</text>
  <text x="52" y="314" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#9aa7c2">GTC / CVPR 2026：NuRec 重建 · InstantNuRec 道路 · Khronos/OpenUSD 将 3DGS 定为「3D 的 JPEG」</text>
