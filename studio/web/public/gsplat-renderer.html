<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SplatVerse Studio — 3DGS Renderer (gsplat.js v1.2.9)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #canvas { width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute; top: 10px; left: 10px; color: #4ecdc4; font: 12px monospace;
      pointer-events: none; user-select: none; z-index: 10;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }
    #status {
      position: absolute; bottom: 10px; left: 10px; color: #666; font: 11px monospace;
      pointer-events: none; z-index: 10;
    }
    #wsbar {
      position: absolute; bottom: 28px; left: 10px; color: #7fae8a; font: 11px monospace;
      pointer-events: none; z-index: 10; max-width: 92%; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #ff6b6b; font: 14px monospace; text-align: center; display: none; z-index: 10;
      max-width: 80%; word-wrap: break-word;
    }
    #progress {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #4ecdc4; font: 13px monospace; z-index: 10;
      display: none;
    }
    #stats {
      position: absolute; top: 10px; right: 10px; color: #888; font: 11px monospace;
      pointer-events: none; z-index: 10; text-align: right;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="overlay">SplatVerse Studio — gsplat.js v1.2.9</div>
  <div id="status">Initializing...</div>
  <div id="wsbar">WS: initializing...</div>
  <div id="error"></div>
  <div id="progress">Loading scene... 0%</div>
  <div id="stats"></div>

  <!--
    gsplat.js v1.2.9 — ESM-only, no UMD build.
    Use importmap to resolve the "gsplat" bare specifier to CDN.
  -->
  <script type="importmap">
  {
    "imports": {
      "gsplat": "https://cdn.jsdelivr.net/npm/gsplat@1.2.9/dist/index.es.js"
    }
  }
  </script>

  <!--
    preserveDrawingBuffer hack:
    gsplat.js WebGLRenderer calls canvas.getContext('webgl2', { antialias: false })
    without preserveDrawingBuffer, making toDataURL() return blank.
    We monkey-patch getContext to inject preserveDrawingBuffer: true.
  -->
  <script>
    (function() {
      const _origGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function(type, attrs) {
        if (type === 'webgl2' || type === 'webgl') {
          attrs = Object.assign({}, attrs, { preserveDrawingBuffer: true });
        }
        return _origGetContext.call(this, type, attrs);
      };
    })();
  </script>

  <script type="module">
    import * as SPLAT from "gsplat";

    // ---- DOM refs ----
    const statusEl  = document.getElementById('status');
    const errorEl   = document.getElementById('error');
    const progressEl = document.getElementById('progress');
    const overlayEl = document.getElementById('overlay');
    const statsEl   = document.getElementById('stats');
    const wsbarEl   = document.getElementById('wsbar');

    // ---- WS status bar (connection state + last message) ----
    let wsStateText = 'disconnected';
    let lastWsMsgText = '';
    function updateWsBar() {
      wsbarEl.textContent = 'WS: ' + wsStateText +
        (lastWsMsgText ? ' | last: ' + lastWsMsgText : '');
    }

    // ---- gsplat.js core objects ----
    let scene, camera, renderer, controls;
    let currentSplat = null;
    let animFrameId = 0;

    // ---- Config ----
    // Bridge server base URL — construct scene file URLs from this
    const BRIDGE_BASE = window.location.protocol + '//' + window.location.hostname + ':' + window.location.port;
    const SCENE_API   = BRIDGE_BASE + '/api/files/scenes';

    // ---- WebSocket (MCP Server renderer bridge) ----
    // Same host as the page: HTTP+WS share port 9842 on the MCP server.
    const WS_PORT = 9842;
    const WS_URL = 'ws://' + location.hostname + ':' + WS_PORT;
    let ws = null;
    let wsReconnectTimer = null;
    // Metadata from a load_point_cloud text message, waiting for its binary payload
    let pendingPointCloudMeta = null;

    // ---- postMessage (parent iframe communication) ----
    const parentOrigin = '*';

    // ================================================================
    //  Initialization
    // ================================================================

    function initGsplat() {
      const canvas = document.getElementById('canvas');

      scene    = new SPLAT.Scene();
      camera   = new SPLAT.Camera();
      renderer = new SPLAT.WebGLRenderer(canvas);
      controls = new SPLAT.OrbitControls(camera, renderer.canvas);

      statusEl.textContent = 'gsplat.js v1.2.9 ready. Load a scene...';

      // Render loop
      const frame = () => {
        controls.update();
        renderer.render(scene, camera);
        animFrameId = requestAnimationFrame(frame);
      };
      animFrameId = requestAnimationFrame(frame);
    }

    // ================================================================
    //  Scene Loading
    // ================================================================

    async function loadSceneFromUrl(url, opts) {
      opts = opts || {};
      showProgress('Loading scene... 0%');
      hideError();

      try {
        // Remove previous splat
        if (currentSplat) {
          scene.removeObject(currentSplat);
          currentSplat = null;
        }

        // Determine format from URL
        const ext = url.split('.').pop().toLowerCase();

        if (ext === 'ply') {
          currentSplat = await SPLAT.PLYLoader.LoadAsync(
            url, scene,
            function(progress) {
              showProgress('Loading PLY... ' + Math.round(progress * 100) + '%');
            },
            '',    // splatFormat: empty = auto-detect
            false  // useCache: false = always fresh
          );
        } else {
          // .splat, .ksplat, .spz — use generic Loader
          currentSplat = await SPLAT.Loader.LoadAsync(
            url, scene,
            function(progress) {
              showProgress('Loading scene... ' + Math.round(progress * 100) + '%');
            },
            false  // useCache: false
          );
        }

        hideProgress();

        // Auto-fit camera using Splat.bounds
        let gaussCount = 0;
        if (currentSplat) {
          autoFitCamera(currentSplat);
          gaussCount = currentSplat.data
            ? (currentSplat.data.positions.length / 3)
            : 0;
          statsEl.textContent = gaussCount.toLocaleString() + ' gaussians';
        }

        statusEl.textContent = 'Loaded: ' + url.split('/').pop();
        overlayEl.textContent = 'SplatVerse Studio — ' + url.split('/').pop();

        // Notify both channels (skipped when the caller sends its own
        // id-tagged scene_loaded reply over WebSocket)
        if (!opts.skipNotify) {
          notifySceneLoaded(url);
        }
        return gaussCount;

      } catch (e) {
        hideProgress();
        const msg = e.message || String(e);
        showError('Load failed: ' + msg);
        statusEl.textContent = 'Load failed';
        if (!opts.skipNotify) {
          notifyError(msg, 'load_scene');
        }
        if (opts.rethrow) throw e;
        return -1;
      }
    }

    /**
     * Auto-fit camera to scene bounding box.
     * gsplat.js Splat has a `bounds` property (Box3 with min/max/center/size).
     */
    function autoFitCamera(splat) {
      try {
        const bounds = splat.bounds;
        const center = bounds.center();
        const size   = bounds.size();

        // Use the maximum dimension to determine camera distance
        const maxDim = Math.max(size.x, size.y, size.z);
        const distance = maxDim * 1.8;

        // Position camera along Z axis (common default view), looking at center
        // gsplat.js Camera.position is a setter that takes a Vector3
        camera.position = new SPLAT.Vector3(center.x, center.y, center.z + distance);
        controls.setCameraTarget(new SPLAT.Vector3(center.x, center.y, center.z));

        statusEl.textContent = 'Camera auto-fit: center(' +
          center.x.toFixed(1) + ', ' + center.y.toFixed(1) + ', ' + center.z.toFixed(1) +
          ') dist=' + distance.toFixed(1);
      } catch (e) {
        // Fallback: reset to default
        camera.position = new SPLAT.Vector3(0, 1.5, 4);
        controls.setCameraTarget(new SPLAT.Vector3(0, 0.8, 0));
      }
    }

    // ================================================================
    //  Camera Control
    // ================================================================

    function setCamera(position, target) {
      if (position && position.length === 3) {
        camera.position = new SPLAT.Vector3(position[0], position[1], position[2]);
      }
      if (target && target.length === 3) {
        controls.setCameraTarget(new SPLAT.Vector3(target[0], target[1], target[2]));
      }
    }

    function getCameraInfo() {
      return {
        position: [camera.position.x, camera.position.y, camera.position.z],
        target: [controls.target ? controls.target.x : 0,
                 controls.target ? controls.target.y : 0,
                 controls.target ? controls.target.z : 0],
      };
    }

    // ================================================================
    //  Screenshot / Frame Capture
    // ================================================================

    function captureFrame() {
      try {
        const canvas = renderer.canvas;
        const dataUrl = canvas.toDataURL('image/png');
        return dataUrl;
      } catch (e) {
        console.warn('[gsplat-renderer] captureFrame failed:', e);
        return null;
      }
    }

    // ================================================================
    //  WebSocket Communication (MCP Server — full protocol)
    // ================================================================

    function connectWebSocket() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

      try {
        wsStateText = 'connecting...'; updateWsBar();
        ws = new WebSocket(WS_URL);
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
          wsStateText = 'connected'; updateWsBar();
          statusEl.textContent = 'WebSocket connected to MCP Server (' + WS_URL + ')';
          // Protocol handshake: identify this renderer right after connecting
          ws.send(JSON.stringify({
            type: 'hello',
            renderer: 'gsplat',
            capabilities: ['splat-render', 'point-cloud', 'capture'],
          }));
          if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
        };

        ws.onclose = function() {
          ws = null;
          wsStateText = 'disconnected (retrying...)'; updateWsBar();
          if (!wsReconnectTimer) {
            wsReconnectTimer = setTimeout(function() {
              wsReconnectTimer = null;
              connectWebSocket();
            }, 5000);
          }
        };

        ws.onerror = function() { /* onclose handles reconnect */ };

        ws.onmessage = function(event) {
          if (typeof event.data === 'string') {
            let msg;
            try {
              msg = JSON.parse(event.data);
            } catch (ex) { return; /* ignore non-JSON */ }
            handleWsMessage(msg);
          } else if (event.data instanceof ArrayBuffer) {
            handleBinaryPointCloud(event.data);
          } else if (typeof Blob !== 'undefined' && event.data instanceof Blob) {
            event.data.arrayBuffer().then(handleBinaryPointCloud).catch(function(e) {
              console.warn('[gsplat-renderer] Blob read failed:', e);
            });
          }
        };
      } catch (e) {
        wsStateText = 'connection failed'; updateWsBar();
        showError('WebSocket connection failed: ' + e.message);
      }
    }

    function handleWsMessage(msg) {
      lastWsMsgText = String(msg.type) + (msg.id !== undefined ? ' (id=' + msg.id + ')' : '');
      updateWsBar();

      switch (msg.type) {
        case 'connected':
          statusEl.textContent = 'MCP Server connected';
          break;

        case 'load_gaussians_url':
          handleLoadGaussiansUrl(msg);
          break;

        case 'load_point_cloud':
          // Metadata for the binary point-cloud payload that follows immediately
          pendingPointCloudMeta = {
            id: msg.id,
            sceneId: msg.sceneId,
            pointCount: msg.pointCount,
            bboxCenter: msg.bboxCenter,
            bboxSize: msg.bboxSize,
          };
          statusEl.textContent = 'Waiting for point cloud binary (' + msg.pointCount + ' points)...';
          break;

        case 'load_scene':
          // Composite scene notification — ack directly; real data arrives
          // via load_gaussians_url / load_point_cloud.
          wsSend({
            type: 'scene_loaded',
            id: msg.id,
            sceneId: msg.sceneId,
            gaussianCount: 0,
            bbox: { min: [0, 0, 0], max: [0, 0, 0] },
          });
          break;

        case 'set_camera':
          if (msg.position || msg.target) {
            setCamera(msg.position, msg.target);
          }
          applyFovAndUp(msg);
          wsSend({ type: 'pong', id: msg.id });
          break;

        case 'render':
          handleWsRender(msg);
          break;

        case 'render_request':
          // Legacy manual capture flow (kept for backward compatibility)
          handleRenderRequest('ws');
          break;

        case 'export':
        case 'set_stereoscopic':
        case 'ping':
          // Export is handled server-side; just acknowledge
          wsSend({ type: 'pong', id: msg.id });
          break;

        default:
          // Unknown command — acknowledge so the server never hangs
          if (msg.id !== undefined) {
            wsSend({ type: 'pong', id: msg.id });
          }
          statusEl.textContent = 'WS msg: ' + msg.type;
      }
    }

    function wsSend(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
      }
    }

    /** bbox = bboxCenter ± bboxSize/2; falls back to current splat bounds. */
    function computeBbox(bboxCenter, bboxSize) {
      if (bboxCenter && bboxSize && bboxCenter.length === 3 && bboxSize.length === 3) {
        return {
          min: [bboxCenter[0] - bboxSize[0] / 2, bboxCenter[1] - bboxSize[1] / 2, bboxCenter[2] - bboxSize[2] / 2],
          max: [bboxCenter[0] + bboxSize[0] / 2, bboxCenter[1] + bboxSize[1] / 2, bboxCenter[2] + bboxSize[2] / 2],
        };
      }
      try {
        if (currentSplat && currentSplat.bounds) {
          const b = currentSplat.bounds;
          return {
            min: [b.min.x, b.min.y, b.min.z],
            max: [b.max.x, b.max.y, b.max.z],
          };
        }
      } catch (e) { /* bounds unavailable */ }
      return { min: [0, 0, 0], max: [0, 0, 0] };
    }

    /** Apply optional fov/up from set_camera (best effort for gsplat.js Camera). */
    function applyFovAndUp(msg) {
      try {
        if (typeof msg.fov === 'number') {
          if ('fovX' in camera) camera.fovX = msg.fov;
          if ('fovY' in camera) camera.fovY = msg.fov;
        }
        if (msg.up && msg.up.length === 3 && 'up' in camera) {
          camera.up = new SPLAT.Vector3(msg.up[0], msg.up[1], msg.up[2]);
        }
      } catch (e) { /* camera model may not support fov/up — ignore */ }
    }

    /**
     * load_gaussians_url — load a real 3DGS PLY served by the MCP server
     * (http://<ws host>:9842<url>) via gsplat.js (sort + alpha compositing),
     * then reply with scene_loaded carrying the same id.
     */
    async function handleLoadGaussiansUrl(msg) {
      const rawUrl = msg.url || '';
      const url = /^https?:\/\//i.test(rawUrl)
        ? rawUrl
        : 'http://' + location.hostname + ':' + WS_PORT + rawUrl;

      statusEl.textContent = 'Loading gaussians: ' + url;
      try {
        const gaussianCount = await loadSceneFromUrl(url, { skipNotify: true, rethrow: true });
        wsSend({
          type: 'scene_loaded',
          id: msg.id,
          sceneId: msg.sceneId,
          gaussianCount: gaussianCount > 0 ? gaussianCount : 0,
          bbox: computeBbox(msg.bboxCenter, msg.bboxSize),
        });
      } catch (e) {
        wsSend({
          type: 'error',
          id: msg.id,
          sceneId: msg.sceneId,
          error: 'Load failed: ' + ((e && e.message) || String(e)),
        });
      }
    }

    /**
     * render — capture the current canvas frame (preserveDrawingBuffer is
     * monkey-patched in) and reply with prefix-stripped base64.
     */
    function handleWsRender(msg) {
      const t0 = performance.now();
      const fmt = (msg.format === 'jpeg' || msg.format === 'jpg') ? 'image/jpeg' : 'image/png';
      try {
        // Force a fresh draw right before reading back the framebuffer
        renderer.render(scene, camera);
        const canvas = renderer.canvas;
        const dataUrl = canvas.toDataURL(fmt);
        const renderTimeMs = Math.round(performance.now() - t0);
        const base64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
        wsSend({
          type: 'render_result',
          id: msg.id,
          image: base64,
          renderTimeMs: renderTimeMs,
          width: canvas.width,
          height: canvas.height,
        });
      } catch (e) {
        wsSend({ type: 'error', id: msg.id, error: 'Render failed: ' + ((e && e.message) || String(e)) });
      }
    }

    /**
     * Binary point-cloud payload: [u32 count][u32 byteLen][count × 7 × f32:
     * x,y,z,r,g,b,opacity] little-endian. Paired with the preceding
     * load_point_cloud metadata message; acked with scene_loaded.
     */
    function handleBinaryPointCloud(buffer) {
      const meta = pendingPointCloudMeta || {};
      pendingPointCloudMeta = null;
      try {
        if (buffer.byteLength < 8) throw new Error('binary payload too short');
        const view = new DataView(buffer);
        const count = view.getUint32(0, true);
        const byteLen = view.getUint32(4, true);
        const expected = 8 + count * 7 * 4;
        if (buffer.byteLength < expected) {
          throw new Error('binary payload truncated: expected ' + expected + ' bytes, got ' + buffer.byteLength);
        }
        // Validate the interleaved float layout (splat pipeline has no native
        // point-cloud primitive, so we acknowledge without rasterizing it)
        const floats = new Float32Array(buffer.slice(8, 8 + count * 7 * 4));
        statusEl.textContent = 'Point cloud received: ' + count + ' points (' +
          (buffer.byteLength / 1048576).toFixed(1) + ' MB, declared byteLen=' + byteLen + ')';
        console.log('[gsplat-renderer] point cloud binary parsed: count=' + count +
          ' byteLen=' + byteLen + ' first=[' + Array.prototype.slice.call(floats, 0, 7).join(',') + ']');
        wsSend({
          type: 'scene_loaded',
          id: meta.id,
          sceneId: meta.sceneId,
          gaussianCount: count,
          bbox: computeBbox(meta.bboxCenter, meta.bboxSize),
        });
      } catch (e) {
        console.error('[gsplat-renderer] binary parse failed:', e);
        wsSend({ type: 'error', id: meta.id, error: 'Binary parse failed: ' + (e.message || String(e)) });
      }
    }

    function handleLoadScene(msg) {
      let url = '';
      if (msg.url) {
        url = msg.url;
      } else if (msg.source) {
        if (msg.source.startsWith('http')) {
          url = msg.source;
        } else {
          const filename = msg.source.replace(/^scenes\//, '');
          url = SCENE_API + '/' + filename;
        }
      }

      if (!url) {
        showError('No scene URL or source provided');
        return;
      }

      loadSceneFromUrl(url);
    }

    function handleRenderRequest(replyVia) {
      const dataUrl = captureFrame();
      if (dataUrl) {
        if (replyVia === 'ws' && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'render_result', image: dataUrl }));
        }
        if (replyVia === 'postMessage' && window.parent) {
          window.parent.postMessage({ type: 'render_result', image: dataUrl }, parentOrigin);
        }
      } else {
        if (replyVia === 'ws' && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'render_error', error: 'Screenshot failed' }));
        }
        if (replyVia === 'postMessage' && window.parent) {
          window.parent.postMessage({ type: 'render_error', error: 'Screenshot failed' }, parentOrigin);
        }
      }
    }

    // ================================================================
    //  postMessage Communication (Parent iframe)
    // ================================================================

    function setupPostMessageListener() {
      window.addEventListener('message', function(event) {
        const msg = event.data;
        if (!msg || !msg.type) return;

        switch (msg.type) {
          case 'load_scene':
            handleLoadScene(msg);
            break;

          case 'set_camera':
            if (msg.position && msg.target) {
              setCamera(msg.position, msg.target);
            }
            break;

          case 'render_request':
            handleRenderRequest('postMessage');
            break;

          case 'get_camera':
            window.parent.postMessage({
              type: 'camera_info',
              camera: getCameraInfo(),
            }, parentOrigin);
            break;

          case 'ping':
            window.parent.postMessage({ type: 'pong' }, parentOrigin);
            break;
        }
      });
    }

    // ================================================================
    //  Notification helpers
    // ================================================================

    function notifySceneLoaded(url) {
      const msg = { type: 'scene_loaded', source: url };
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(msg, parentOrigin);
      }
    }

    function notifyError(error, context) {
      const msg = { type: 'error', error: error, context: context };
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(msg, parentOrigin);
      }
    }

    // ================================================================
    //  UI helpers
    // ================================================================

    function showProgress(text) {
      progressEl.textContent = text;
      progressEl.style.display = 'block';
    }
    function hideProgress() {
      progressEl.style.display = 'none';
    }
    function showError(text) {
      errorEl.textContent = text;
      errorEl.style.display = 'block';
    }
    function hideError() {
      errorEl.style.display = 'none';
    }

    // ================================================================
    //  Expose global API
    // ================================================================

    window.splatverse = {
      loadScene: loadSceneFromUrl,
      setCamera: setCamera,
      captureFrame: captureFrame,
      getCameraInfo: getCameraInfo,
      getScene: function() { return scene; },
      getCamera: function() { return camera; },
      getControls: function() { return controls; },
      getRenderer: function() { return renderer; },
    };

    // ================================================================
    //  Boot
    // ================================================================

    initGsplat();
    connectWebSocket();
    setupPostMessageListener();

    // Signal readiness to parent
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'renderer_ready', engine: 'gsplat' }, parentOrigin);
    }
  </script>
</body>
</html>
