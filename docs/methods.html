<script>
// Lazy-load model-viewer when needed
function loadModelViewer() {
  if (document.querySelector('model-viewer[model-viewer-loaded]')) return;
  const s = document.createElement('script');
  s.type = 'module';
  s.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js';
  document.head.appendChild(s);
  document.querySelectorAll('model-viewer').forEach(mv => mv.setAttribute('model-viewer-loaded', ''));
}
// Load when Text2Word or Img2GS section becomes visible
if ('IntersectionObserver' in window) {
  const mvObs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { loadModelViewer(); mvObs.disconnect(); } });
  }, { rootMargin: '200px' });
  document.addEventListener('DOMContentLoaded', () => {
    const t2w = document.getElementById('text2word');
    const i2g = document.getElementById('img2gs');
    if (t2w) mvObs.observe(t2w);
    if (i2g) mvObs.observe(i2g);
  });
}

/* ============================================================================
   Method Explorer v2
   约束：678 条方法、弱机可用、键盘可达、状态可分享
   - 预建检索索引：启动时一次性小写化，输入时零重复计算
   - 分块渲染：首屏 48 张 + 哨兵自动续载，避免 858 节点同步插入阻塞主线程
   - 卡片全部走自定义 class：绕开 Tailwind 运行时对 678 个节点的类名重扫
   - 状态写入 URL：分类 / 搜索 / 排序可分享、刷新可还原
   - 全字段转义 + 命中高亮
   ========================================================================== */
var PAGE_SIZE = 48;

var activeCategory = 'All';
var currentSort = 'default';
var searchQuery = '';

var SEARCH_INDEX = METHODS.map(function (m, i) {
  return {
    i: i,
    hay: [m.name, m.short, m.desc, m.cat, m.venue, m.year, m.arxiv || ''].join(' ').toLowerCase()
  };
});

var _result = [];      // 当前结果集（METHODS 下标）
var _rendered = 0;     // 已插入 DOM 的条数
var _modalName = null; // 当前打开的详情
var _lastFocus = null; // 打开详情前的焦点元素

/* ---------- 基础工具 ---------- */
function venueColor(v) {
  var map = { CVPR: '#1a73e8', SIGGRAPH: '#e8453c', ICLR: '#ff8c00', NeurIPS: '#ff6f00', ECCV: '#4285f4', ICML: '#e91e63', RSS: '#00bcd4', arXiv: '#6b7280', ICPR: '#00897b' };
  return map[v] || '#6b7280';
}

function catLabel(id) {
  if (window.AGS_LANG !== 'zh') return id;
  for (var i = 0; i < CATEGORIES.length; i++) {
    if (CATEGORIES[i].id === id) return CATEGORIES[i].labelZh || CATEGORIES[i].label;
  }
  return id;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* 显示名归一化：修正历史上误把 \uXXXX 转义字面量写入方法名导致的乱码
   （数据层的重复/转义问题仍需在 methods.json 等载体中修复，此处只保证展示正确） */
function cleanName(s) {
  var v = String(s == null ? '' : s);
  if (v.indexOf('\\u') === -1) return v;
  return v.replace(/\\u([0-9a-fA-F]{4})/g, function (_, h) {
    return String.fromCharCode(parseInt(h, 16));
  });
}

function highlight(text, q) {
  var safe = esc(text);
  if (!q) return safe;
  var needle = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return safe.replace(new RegExp('(' + needle + ')', 'ig'), '<mark class="hl">$1</mark>'); }
  catch (e) { return safe; }
}

/* ---------- 结果集 ---------- */
function computeResults() {
  var q = searchQuery.trim().toLowerCase();
  var out = [];
  for (var n = 0; n < SEARCH_INDEX.length; n++) {
    var m = METHODS[SEARCH_INDEX[n].i];
    if (activeCategory !== 'All' && m.cat !== activeCategory) continue;
    if (q && SEARCH_INDEX[n].hay.indexOf(q) === -1) continue;
    out.push(SEARCH_INDEX[n].i);
  }
  if (currentSort === 'newest') {
    out.sort(function (a, b) {
      var A = METHODS[a], B = METHODS[b];
      if (B.year !== A.year) return B.year - A.year;
      var ka = A.arxiv || '', kb = B.arxiv || '';
      if (!ka && !kb) return A.name.localeCompare(B.name, 'en');
      if (!ka) return 1;          // 无 arXiv ID 的沉底
      if (!kb) return -1;
      return kb.localeCompare(ka);
    });
  } else if (currentSort === 'name') {
    out.sort(function (a, b) { return METHODS[a].name.localeCompare(METHODS[b].name, 'en'); });
  } else if (currentSort === 'code') {
    out.sort(function (a, b) {
      var A = (METHOD_DETAILS[METHODS[a].name] || {}).codeUrl ? 0 : 1;
      var B = (METHOD_DETAILS[METHODS[b].name] || {}).codeUrl ? 0 : 1;
      return A - B || METHODS[a].name.localeCompare(METHODS[b].name, 'en');
    });
  }
  return out;
}

/* ---------- 单卡片 ---------- */
function cardHtml(mi, q) {
  var m = METHODS[mi];
  var d = METHOD_DETAILS[m.name] || {};
  var desc = m.desc ? highlight(m.desc, q) : '<span class="mc-dim">—</span>';
  var tail = '';
  if (d.codeUrl) tail += '<span class="mc-code" title="' + esc(t('methods.hasCode')) + '"></span>';
  if (m.arxiv) tail += '<span class="mc-arxiv">' + esc(m.arxiv) + '</span>';
  return '<a class="mc" href="#m=' + encodeURIComponent(m.name) + '" data-mi="' + mi + '" role="button">' +
      '<span class="mc-head">' +
        '<span class="mc-title">' + highlight(cleanName(m.name), q) + '</span>' +
        '<span class="mc-venue" style="background:' + venueColor(m.venue) + '">' + esc(m.venue) + ' ' + esc(m.year) + '</span>' +
      '</span>' +
      '<span class="mc-desc">' + desc + '</span>' +
      '<span class="mc-foot">' +
        '<span class="mc-cat">' + esc(catLabel(m.cat)) + '</span>' +
        '<span class="mc-meta">' + tail + '</span>' +
      '</span>' +
    '</a>';
}

/* ---------- 渲染：分块插入 + 元信息 ---------- */
function renderMethods(reset) {
  if (reset === undefined) reset = true;
  var grid = document.getElementById('methodGrid');
  if (!grid) return;
  if (reset) {
    _result = computeResults();
    _rendered = 0;
    grid.innerHTML = '';
  }
  var q = searchQuery.trim();
  var slice = _result.slice(_rendered, _rendered + PAGE_SIZE);
  if (slice.length) {
    var buf = '';
    for (var i = 0; i < slice.length; i++) buf += cardHtml(slice[i], q);
    grid.insertAdjacentHTML('beforeend', buf);   // 一次性插入，避免 N 次重排
    _rendered += slice.length;
  }
  updateExplorerMeta();
}

function updateExplorerMeta() {
  var total = _result.length;
  var zh = window.AGS_LANG === 'zh';
  var countEl = document.getElementById('methodCount');
  if (countEl) {
    if (total === 0) {
      countEl.textContent = zh ? '没有匹配的方法' : 'No matching methods';
    } else if (_rendered < total) {
      countEl.textContent = zh
        ? '匹配 ' + total + ' 个 · 已显示 ' + _rendered
        : total + ' matched · showing ' + _rendered;
    } else {
      countEl.textContent = zh ? '共 ' + total + ' 个方法' : total + ' method' + (total === 1 ? '' : 's');
    }
  }

  var moreWrap = document.getElementById('loadMoreWrap');
  if (moreWrap) moreWrap.hidden = _rendered >= total;

  var empty = document.getElementById('methodEmpty');
  if (empty) {
    empty.hidden = total !== 0;
    if (total === 0) {
      var kw = document.getElementById('emptyKeyword');
      if (kw) kw.textContent = searchQuery.trim() || catLabel(activeCategory);
    }
  }

  var filterBar = document.getElementById('activeFilterBar');
  if (filterBar) {
    var parts = [];
    if (activeCategory !== 'All') parts.push(catLabel(activeCategory));
    if (searchQuery.trim()) parts.push('“' + searchQuery.trim() + '”');
    filterBar.hidden = parts.length === 0;
    var ft = document.getElementById('activeFilterText');
    if (ft) ft.textContent = parts.join(' · ');
  }
  syncUrlState();
}

/* ---------- URL 状态 ---------- */
function syncUrlState() {
  if (!window.history || !history.replaceState) return;
  var p = new URLSearchParams(location.search);
  if (searchQuery.trim()) p.set('q', searchQuery.trim()); else p.delete('q');
  if (activeCategory !== 'All') p.set('cat', activeCategory); else p.delete('cat');
  if (currentSort !== 'default') p.set('sort', currentSort); else p.delete('sort');
  var qs = p.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
}

function readUrlState() {
  var p = new URLSearchParams(location.search);
  var q = p.get('q');
  if (q) {
    searchQuery = q;
    var el = document.getElementById('searchInput');
    if (el) el.value = q;
  }
  var c = p.get('cat');
  if (c && (c === 'All' || CATEGORIES.some(function (x) { return x.id === c; }))) {
    activeCategory = c;
  } else {
    // 兼容旧链接 #<Category>；语言用 #en/#zh、锚点用 #methods、详情用 #m=，均排除
    var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (h && h.indexOf('=') === -1 && h !== 'en' && h !== 'zh' &&
        CATEGORIES.some(function (x) { return x.id === h; })) {
      activeCategory = h;
    }
  }
  var s = p.get('sort');
  if (s === 'newest' || s === 'name' || s === 'code' || s === 'default') currentSort = s;
}

/* ---------- 方法详情 ---------- */
function abstractSlotHtml(name) {
  var a = ABSTRACTS[name] || {};
  var en = a.abstractEn || '', cn = a.abstractCn || '';
  if (!en && !cn) {
    return '<p class="mtext mtext-dim" id="abstractPending">' +
      esc(ABSTRACTS_READY ? t('modal.abstract.none') : t('modal.abstract.loading')) + '</p>';
  }
  return '<div class="modal-tabs" id="abstractTabs">' +
      '<button type="button" class="modal-tab active" data-lang="en" onclick="switchAbstractTab(\'en\')">' + esc(t('modal.abstract.en')) + '</button>' +
      '<button type="button" class="modal-tab" data-lang="cn" onclick="switchAbstractTab(\'cn\')">' + esc(t('modal.abstract.zh')) + '</button>' +
    '</div>' +
    '<div id="abstractEn" class="abstract-panel active"><p class="mtext">' + (esc(en) || 'N/A') + '</p></div>' +
    '<div id="abstractCn" class="abstract-panel"><p class="mtext">' + (esc(cn) || 'N/A') + '</p></div>';
}

function openMethodModal(target) {
  var mi = typeof target === 'number'
    ? target
    : METHODS.findIndex(function (x) { return x.name === target; });
  if (mi < 0 || !METHODS[mi]) return;
  var m = METHODS[mi];
  var d = METHOD_DETAILS[m.name] || {};

  var innovBlock;
  if (d.innovation) {
    innovBlock = '<p class="mtext">' + esc(d.innovation) + '</p>';
  } else if (d.innovations && d.innovations.length) {
    innovBlock = '<ul class="mlist">' + d.innovations.map(function (x) {
      return '<li>' + esc(x) + '</li>';
    }).join('') + '</ul>';
  } else {
    innovBlock = '<p class="mtext mtext-dim">' + esc(t('modal.noData')) + '</p>';
  }

  var linkRow = '';
  if (m.arxiv) {
    linkRow += '<a href="https://arxiv.org/abs/' + encodeURIComponent(m.arxiv) + '" target="_blank" rel="noopener" class="mlink mlink-arxiv">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>' +
      'arXiv:' + esc(m.arxiv) + '</a>';
  }
  if (d.codeUrl) {
    linkRow += '<a href="' + esc(d.codeUrl) + '" target="_blank" rel="noopener" class="mlink mlink-code">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>' +
      esc(t('modal.code')) + '</a>';
  }
  if (!linkRow) linkRow = '<span class="mtext mtext-dim">' + esc(t('modal.noLink')) + '</span>';

  document.getElementById('modalContent').innerHTML =
    '<button type="button" class="modal-close" aria-label="' + esc(t('modal.close')) + '" onclick="closeMethodModal()">&times;</button>' +
    '<div class="pr-6">' +
      '<div class="modal-head">' +
        '<h2 class="modal-title">' + esc(cleanName(m.name)) + '</h2>' +
        '<span class="mc-venue" style="background:' + venueColor(m.venue) + '">' + esc(m.venue) + ' ' + esc(m.year) + '</span>' +
      '</div>' +
      '<div class="modal-sub">' +
        '<span class="modal-cat">' + esc(catLabel(m.cat)) + '</span>' +
        (d.nameCn && d.nameCn !== m.name ? '<span class="mtext mtext-dim">' + esc(d.nameCn) + '</span>' : '') +
      '</div>' +
      '<div class="modal-section">' +
        '<p class="modal-label">' + esc(t('modal.innovation')) + '</p>' + innovBlock +
      '</div>' +
      '<div class="modal-section" id="abstractSlot">' + abstractSlotHtml(m.name) + '</div>' +
      '<div class="modal-links">' + linkRow + '</div>' +
    '</div>';

  _modalName = m.name;
  _lastFocus = document.activeElement;

  var modal = document.getElementById('methodModal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');

  // 补偿滚动条宽度，避免打开瞬间页面横向跳动
  var sbw = window.innerWidth - document.documentElement.clientWidth;
  document.body.style.paddingRight = sbw > 0 ? sbw + 'px' : '';
  document.body.style.overflow = 'hidden';

  var box = document.getElementById('modalContent');
  box.setAttribute('tabindex', '-1');
  try { box.focus({ preventScroll: true }); } catch (e) { box.focus(); }

  if (history.replaceState) {
    history.replaceState(null, '', location.pathname + location.search + '#m=' + encodeURIComponent(m.name));
  }

  // 摘要尚未就绪 → 补齐后原地更新，避免出现"没有摘要"的错觉
  if (!ABSTRACTS_READY) {
    loadAbstracts().then(function () {
      if (_modalName !== m.name) return;
      var slot = document.getElementById('abstractSlot');
      if (slot) slot.innerHTML = abstractSlotHtml(m.name);
    });
  }
}

function closeMethodModal() {
  var modal = document.getElementById('methodModal');
  if (!modal || !modal.classList.contains('open')) return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  document.body.style.paddingRight = '';
  _modalName = null;
  if (_lastFocus && _lastFocus.focus) {
    try { _lastFocus.focus({ preventScroll: true }); } catch (e) {}
  }
  if (location.hash.indexOf('#m=') === 0 && history.replaceState) {
    history.replaceState(null, '', location.pathname + location.search);
  }
}

function switchAbstractTab(lang) {
  document.querySelectorAll('#abstractTabs .modal-tab').forEach(function (b) {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  var en = document.getElementById('abstractEn');
  var cn = document.getElementById('abstractCn');
  if (en) en.classList.toggle('active', lang === 'en');
  if (cn) cn.classList.toggle('active', lang === 'cn');
}

/* Esc 关闭详情 */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && _modalName) closeMethodModal();
});

/* 详情内 Tab 焦点循环，避免焦点跑到背后的页面 */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab' || !_modalName) return;
  var box = document.getElementById('modalContent');
  if (!box) return;
  var f = box.querySelectorAll('a[href], button, [tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* ---------- 分类标签 ---------- */
function renderTabs() {
  var container = document.getElementById('categoryTabs');
  if (!container) return;
  var counts = {};
  METHODS.forEach(function (m) { counts[m.cat] = (counts[m.cat] || 0) + 1; });
  var list = [{ id: 'All', label: t('cat.all'), labelZh: t('cat.all') }].concat(CATEGORIES);
  container.innerHTML = list.map(function (c) {
    var cnt = c.id === 'All' ? METHODS.length : (counts[c.id] || 0);
    var label = (c.id !== 'All' && window.AGS_LANG === 'zh') ? (c.labelZh || c.label) : c.label;
    var on = activeCategory === c.id;
    return '<button type="button" class="category-tab' + (on ? ' active' : '') +
      '" data-cat="' + esc(c.id) + '" aria-pressed="' + on + '">' +
      esc(label) + ' <span class="tab-num">' + cnt + '</span></button>';
  }).join('');
  var active = container.querySelector('.category-tab.active');
  if (active && active.scrollIntoView) {
    try { active.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
  }
}
function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
}, { threshold: 0.01 });

document.addEventListener('DOMContentLoaded', function () {
  /* 1. 先还原 URL 状态（分享链接 / 刷新 / 后退都能对得上） */
  readUrlState();

  renderTabs();
  renderMethods();

  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  const sortHint = document.getElementById('sortHint');
  const SORT_HINTS = {
    newest: 'methods.sortHint.newest',
    name: 'methods.sortHint.name',
    code: 'methods.sortHint.code'
  };

  function syncSortButtons() {
    document.querySelectorAll('.sort-btn').forEach(b => {
      const on = b.dataset.sort === currentSort;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (sortHint) sortHint.textContent = SORT_HINTS[currentSort] ? t(SORT_HINTS[currentSort]) : '';
  }
  syncSortButtons();

  /* 2. 搜索：160ms 防抖，避免每敲一个字就重建整页卡片 */
  let debounceTimer = 0;
  function applyQuery(v) {
    searchQuery = v || '';
    if (clearBtn) clearBtn.hidden = !searchQuery;
    renderMethods();
  }
  if (input) {
    clearBtn.hidden = !input.value;
    input.addEventListener('input', () => {
      clearBtn.hidden = !input.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => applyQuery(input.value), 160);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') { input.value = ''; applyQuery(''); input.blur(); }
      else if (e.key === 'Enter') { clearTimeout(debounceTimer); applyQuery(input.value); }
    });
  }
  if (clearBtn) clearBtn.addEventListener('click', () => {
    if (input) { input.value = ''; input.focus(); }
    applyQuery('');
  });

  /* 按 "/" 直达搜索框；不在输入框内才拦截 */
  document.addEventListener('keydown', e => {
    if (e.key !== '/' || _modalName) return;
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
    e.preventDefault();
    if (input) { input.focus(); input.select(); }
  });

  /* 3. 分类：事件委托，避免每次重绘都重绑 23 个监听 */
  const tabs = document.getElementById('categoryTabs');
  if (tabs) {
    tabs.addEventListener('click', e => {
      const btn = e.target.closest('.category-tab');
      if (!btn) return;
      activeCategory = btn.dataset.cat;
      renderTabs();
      renderMethods();
    });
  }

  /* 4. 排序 */
  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSort = btn.dataset.sort || 'default';
      syncSortButtons();
      renderMethods();
    });
  });

  /* 5. 续载：按钮 + 哨兵自动加载，首屏只渲染 48 张 */
  const moreBtn = document.getElementById('loadMoreBtn');
  if (moreBtn) moreBtn.addEventListener('click', () => renderMethods(false));

  const sentinel = document.getElementById('methodSentinel');
  if (sentinel && 'IntersectionObserver' in window) {
    const so = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting && _rendered < _result.length) renderMethods(false);
      });
    }, { rootMargin: '500px 0px' });
    so.observe(sentinel);
  }

  /* 6. 一键重置（筛选条 / 空态都复用） */
  function resetExplorer() {
    activeCategory = 'All';
    searchQuery = '';
    currentSort = 'default';
    if (input) input.value = '';
    if (clearBtn) clearBtn.hidden = true;
    syncSortButtons();
    renderTabs();
    renderMethods();
  }
  const clearFilter = document.getElementById('clearFilter');
  if (clearFilter) clearFilter.addEventListener('click', resetExplorer);
  const emptyReset = document.getElementById('emptyReset');
  if (emptyReset) emptyReset.addEventListener('click', resetExplorer);

  /* 7. 卡片：委托点击打开详情；中键 / Ctrl / Cmd 走原生新标签页 */
  const grid = document.getElementById('methodGrid');
  if (grid) {
    grid.addEventListener('click', e => {
      const card = e.target.closest('.mc');
      if (!card) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      openMethodModal(parseInt(card.dataset.mi, 10));
    });
  }

  /* 详情深链：#m=方法名 可直接打开 */
  function openFromHash() {
    const h = location.hash || '';
    if (h.indexOf('#m=') === 0 && !_modalName) {
      let name = h.slice(3);
      try { name = decodeURIComponent(name); } catch (err) {}
      openMethodModal(name);
    }
  }
  openFromHash();
  window.addEventListener('hashchange', () => {
    const h = location.hash || '';
    if (h.indexOf('#m=') === 0) openFromHash();
    else if (_modalName) closeMethodModal();
  });

  /* 8. 回到顶部 */
  const backTop = document.getElementById('backTop');
  if (backTop) {
    const onScroll = () => backTop.classList.toggle('show', window.scrollY > 900);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    backTop.addEventListener('click', () => {
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (err) { window.scrollTo(0, 0); }
    });
  }

  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

});
</script>

</body>
</html>
